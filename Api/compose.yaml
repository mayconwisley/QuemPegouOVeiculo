services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qveiculo_dev
      POSTGRES_USER: ${QVeiculoUser:?Defina QVeiculoUser no ambiente do processo}
      POSTGRES_PASSWORD: ${QVeiculoPass:?Defina QVeiculoPass no ambiente do processo}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
